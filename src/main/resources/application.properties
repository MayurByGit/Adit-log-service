
spring.application.name=audit-log-service

server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:auditdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Optional persistent Ed25519 keys for signed export bundles. Values are
# Base64-encoded PKCS#8 private and X.509 public key bytes. When both are
# omitted, an ephemeral key pair is generated for local development.
audit.export.signing.private-key=${AUDIT_EXPORT_SIGNING_PRIVATE_KEY:}
audit.export.signing.public-key=${AUDIT_EXPORT_SIGNING_PUBLIC_KEY:}
